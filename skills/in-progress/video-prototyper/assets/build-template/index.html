<!--
  Build template for the video-prototyper skill.
  Implements the stage contract and the viewer contract (see references/stage-contract.md
  and references/viewer.md). Copy this folder, keep the runtime, replace the scenes.

  Timeline rules kept here:
  - Every reveal is an anchor A(scene, k, f) on the active timing, never a seconds value.
  - render(t) sets all state from time alone, through inline opacity, display and transform.
  - The playback clock is the only code that reads performance.now().
  - Narration-tied elements carry data-cue (and data-cue-at for a key phrase).
  - An optional [data-bg] layer sits outside the scenes and stays visible; ambient(t, duration)
    sets its motion from time alone. With "loop": true in cues.json the last scene clears by
    the end, so t = duration paints the same frame as t = 0, and playback wraps to 0.
-->
<style>

  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ui); color: var(--ui-ink); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #frame { position: relative; width: 100%; height: calc(100% - var(--controls-h, 112px)); overflow: hidden; background: #0b0e11; }
  body.render #frame { height: 100%; }
  #stage {
    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform-origin: 50% 50%; transform: translate(-50%, -50%) scale(0.5);
    background: var(--ground); color: var(--ink); overflow: hidden;
  }
  .bg { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; }
  .label {
    position: absolute; left: 120px; top: 84px; font-size: 34px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2);
  }
  /* Title card */
  #title-card { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 160px; }
  #title-card .tc-label { font-size: 36px; color: var(--ink-2); letter-spacing: 0.08em; text-transform: uppercase; }
  #title-card .tc-title { font-size: 112px; font-weight: 700; line-height: 1.05; margin: 18px 0 22px; }

  /* Scene 1 */
  #s1-head { position: absolute; left: 120px; top: 150px; font-size: 76px; font-weight: 700; }
  #s1-counter { position: absolute; left: 120px; top: 160px; width: 1680px; height: 560px; }
  #s1-counter .counter-top { position: absolute; left: 0; right: 0; top: 470px; height: 44px; border-radius: 22px; background: var(--line); }

  .bin-lid { position: absolute; left: -12px; right: -12px; top: -28px; height: 40px; border-radius: 14px; }

    max-width: 1600px; padding: 16px 34px; border-radius: 14px; background: var(--plate); color: var(--plate-ink);

  body.render #controls { display: none; }

</div>

    S.music = id;
    syncAudio(S.t, true); updateUI(); post('music');
    return Promise.resolve(state());
  }
  function refresh() {
    if (!SERVED) return Promise.resolve(state());
    var before = JSON.stringify(S.voiceList.map(function (v) { return v.id + v.available; }).concat(S.trackList.map(function (t) { return t.id + t.available; })));
    return loadAll().then(function () {
      var after = JSON.stringify(S.voiceList.map(function (v) { return v.id + v.available; }).concat(S.trackList.map(function (t) { return t.id + t.available; })));
      buildControls(); updateUI();
      if (after !== before) post('availability');
      return state();
    });
  }

  // A clip's file relative to the build folder: its src, else its first <source src>, else currentSrc.
  function clipFile(node) {
    var src = node.getAttribute('src');
    if (!src) {
      var source = node.querySelector ? node.querySelector('source[src]') : null;
      src = source ? source.getAttribute('src') : '';
    }
    if (!src) src = node.currentSrc || '';
    var here = String(location.href || '').split(/[?#]/)[0];
    var dir = here.slice(0, here.lastIndexOf('/') + 1);
    if (dir && src.indexOf(dir) === 0) {
      src = src.slice(dir.length);
      try { src = decodeURIComponent(src); } catch (e) { /* keep the encoded form */ }
    }
    return src;
  }

  // ---------- public API ----------
  var readyResolve, readyReject;
  var api = {
    ready: new Promise(function (res, rej) { readyResolve = res; readyReject = rej; }),
    get duration() { return S.timing ? S.timing.duration : 0; },
    get time() { return S.t; },
    get playing() { return S.playing; },
    get timingWarnings() { return S.timing ? S.timing.warnings.slice() : []; },
    seek: function (t) { seek(t, null); return S.t; },
    frameReady: frameReady,
    play: function () { play(); },
    pause: function () { pause('pause'); },
    mode: function (m) {
      if (m === undefined) return S.mode;
      if (m === 'light' || m === 'dark') { S.mode = m; applyMode(); post('mode'); }
      return S.mode;
    },
    setMode: function (m) { api.mode(m); return state(); },
    setCaptions: function (on) { S.cc = !!on; render(S.t); updateUI(); post('captions'); return state(); },
    voices: function () { return S.voiceList.map(function (v) { return { id: v.id, label: v.label, available: !!v.available }; }); },
    tracks: function () {
      return [{ id: 'off', label: 'Off', available: true }].concat(S.trackList.map(function (t) { return { id: t.id, label: t.label, available: !!t.available }; }));
    },
    setVoice: setVoice,
    setMusic: setMusic,
    seekScene: function (n, f) { seek(sceneTime(num(n, 1), f), 'seek'); return state(); },
    state: state,
    refresh: refresh,
    diagnostics: function () {
      return { t: r4(S.t), voiceTime: r4(voiceAudio.currentTime + (S.timing ? S.timing.preRoll : 0)), voicePaused: voiceAudio.paused,
        musicTime: r4(musicAudio.currentTime), musicPaused: musicAudio.paused, musicLevel: r4(S.timing ? musicLevel(S.t) : 0),
        webAudio: !!audioCtx, warnings: S.timing ? S.timing.warnings.slice() : [] };
    },
    timeline: function () {
      var T = S.timing;
      return JSON.parse(JSON.stringify({ voice: T.voice, preRoll: T.preRoll, duration: T.duration, loop: !!S.cues.loop,
        sentences: T.sentences.map(function (s) { return { id: s.id, scene: s.scene, text: s.text, start: s.vs, end: s.ve }; }),
        scenes: T.scenes.map(function (s) { return { n: s.n, vstart: s.vstart, vend: s.vend }; }), warnings: T.warnings }));
    },
    clips: function () {
      if (!el.stage || !S.timing) return [];
      var nodes = el.stage.querySelectorAll('video[data-clip][data-audio="keep"]'), out = [];
      for (var i = 0; i < nodes.length; i++) {
        var node = nodes[i], anchor = clipAnchor(node);
        if (anchor === null) continue;
        var inn = parseFloat(node.getAttribute('data-in') || '0');
        if (!isFinite(inn) || inn < 0) inn = 0;
        var rate = parseFloat(node.getAttribute('data-rate') || '1');
        if (!isFinite(rate) || rate <= 0) rate = 1;
        var end = clipEnd(node, anchor, inn, rate);
        var entry = { file: clipFile(node), start: r4(anchor), end: r4(end), in: r4(inn), rate: r4(rate) };
        if (node.hasAttribute('data-loop')) entry.loop = true;
        out.push(entry);
      }
      return out;
    }
  };
  window.__video = api;

  // ---------- boot ----------
  if (RENDER) document.body.classList.add('render');
  if (EMBED) document.body.classList.add('embed');
  loadAll().then(function () {
    var tc = S.cues.title_card || {};
    if ($('tc-label')) $('tc-label').textContent = tc.label || '';
    if ($('tc-title')) $('tc-title').textContent = tc.title || S.cues.title || '';
    if ($('tc-kicker')) $('tc-kicker').textContent = tc.kicker || '';
    var mode = params.get('mode') || S.cues.default_mode || 'light';
    S.mode = (mode === 'dark') ? 'dark' : 'light';
    var cc = params.get('cc'), ccDefault = S.cues.captions_default;
    S.cc = cc ? cc !== 'off' : (params.get('captions') === '0' ? false : (ccDefault !== 'off' && ccDefault !== false));
    var lp = params.get('loop');
    S.loopPlay = lp === '1' ? true : (lp === '0' ? false : !!S.cues.loop);
    var want = params.get('voice') || S.voiceDefault;
    var entry = findVoice(want);
    if (!entry || !entry.available) entry = findVoice(S.voiceDefault);
    if (!entry || !entry.available) entry = findVoice('none');
    S.voice = entry.id;
    try { S.timing = buildTiming(entry.timingData ? entry : null); }
    catch (e) { S.voice = 'none'; S.timing = buildTiming(null); }
    setSrc(voiceAudio, entry.audioUrl);
    bindLoose(entry);
    var mus = params.get('music') || S.musicDefault;
    var tr = mus === 'off' ? null : findTrack(mus);
    S.music = tr && tr.available ? tr.id : 'off';
    setSrc(musicAudio, tr && tr.available ? tr.url : null);
    document.body.setAttribute('data-mode', S.mode);
    buildControls();
    fit();
    seek(num(params.get('t'), 0), null);
    S.lastScene = sceneAt(S.t).n;
    var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    return fontsReady;
  }).then(function () {
    render(S.t);
    readyResolve(state());
    post('ready');
  }).catch(function (err) {
    el.note.textContent = String(err && err.message || err);
    readyReject(err);
  });

  // ---------- input ----------
  el.play.addEventListener('click', function () { if (S.playing) pause('pause'); else play(); });
  el.scrub.addEventListener('input', function () { seek((Number(el.scrub.value) / 1000) * S.timing.duration, 'seek'); });
  el.voice.addEventListener('change', function () { setVoice(el.voice.value).catch(function (e) { el.note.textContent = e.message; updateUI(); }); });
  el.music.addEventListener('change', function () { setMusic(el.music.value).catch(function (e) { el.note.textContent = e.message; updateUI(); }); });
  el.mode.addEventListener('click', function () { api.mode(S.mode === 'dark' ? 'light' : 'dark'); });
  el.cc.addEventListener('click', function () { api.setCaptions(!S.cc); });
  document.addEventListener('keydown', function (e) {
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (/^(INPUT|SELECT|BUTTON|TEXTAREA)$/.test(tag) || !S.timing) return;
    if (e.key === ' ') { e.preventDefault(); if (S.playing) pause('pause'); else play(); }
    else if (e.key === 'ArrowLeft') seek(S.t - 0.5, 'seek');
    else if (e.key === 'ArrowRight') seek(S.t + 0.5, 'seek');
    else if (e.key === 'Home') seek(0, 'seek');
    else if (e.key === 'End') seek(S.timing.duration, 'seek');
  });
  window.addEventListener('resize', fit);
  window.addEventListener('focus', function () { refresh(); });
})();
</script>
</body>
</html>
